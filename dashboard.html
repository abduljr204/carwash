<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My appointments | Naqa Qurtuba</title><link rel="stylesheet" href="journey/styles.css"><link rel="stylesheet" href="journey/manage.css"><script defer src="journey/manage.js"></script></head>
<body data-dashboard="customer">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">ق</span><span><strong>NAQA QURTUBA</strong><small>CAR CARE / TRIPOLI</small></span></a><div class="header-actions"><span id="signed-in-phone" dir="ltr"></span><button class="back-button" id="language">العربية</button><button class="back-button" id="logout" data-m="logout">Log out</button></div></header>
<main class="manage-main"><div class="manage-heading"><div><p class="eyebrow" data-m="yourCare">YOUR CAR CARE, IN ONE PLACE</p><h1 data-m="myAppointments">My appointments</h1><p class="muted" data-m="manageIntro">Your next wash, your check-in pass, and every fresh start before it.</p></div><a href="index.html" class="primary-button" data-m="newBooking">Book a wash</a></div>

</main>
