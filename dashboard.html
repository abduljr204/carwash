<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070d1c" />
    <link rel="icon" type="image/svg+xml" href="assets/alfa-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <title data-t="dashboardPageTitle">My appointments | Naqa Qurtuba</title>
    <link rel="stylesheet" href="journey/styles.css" />
    <link rel="stylesheet" href="journey/manage.css" />
    <script defer src="journey/demo.js"></script>
    <script defer src="journey/config.js"></script>
    <script defer src="journey/i18n.js"></script>
    <script defer src="journey/manage.js"></script>
  </head>
  <body data-dashboard="customer">
    <header class="site-header">
      <a class="brand" href="index.html"
        ><img class="brand-logo" src="assets/alfa-logo.svg" alt="" width="75" height="44" /><span
          ><strong data-t="brand">NAQA QURTUBA</strong
          ><small data-t="brandSub">CAR CARE / TRIPOLI</small></span
        ></a
      >
      <div class="header-actions">
        <span id="signed-in-phone" dir="ltr"></span>
        <div class="language-toggle" role="group" data-label="language" aria-label="Language">
          <button type="button" data-language="en" lang="en" aria-pressed="true">English</button
          ><button type="button" data-language="ar" lang="ar" aria-pressed="false">العربية</button>
        </div>
        <button class="back-button" id="logout" data-t="logout">Log out</button>
      </div>
    </header>
    <main class="manage-main">
      <div class="manage-heading">
        <div>
          <p class="eyebrow" data-t="yourCare">YOUR CAR CARE, IN ONE PLACE</p>
          <h1>My appointments</h1>
          <p class="muted" data-t="manageIntro">
            Your next wash, your check-in pass, and every fresh start before it.
          </p>
        </div>
        <a href="index.html" class="primary-button" data-t="newBooking">Book a wash</a>
      </div>
      <p id="reminder-notice" class="notice" hidden></p>
      <p id="page-error" class="error" role="alert" hidden></p>
      <p id="page-status" role="status" aria-live="polite"></p>
      <nav class="manage-tabs" data-label="appointments" aria-label="Appointments">
        <button data-tab="active" aria-current="page">Active bookings</button
        ><button data-tab="past">Past washes</button
        ><button class="refresh-button" id="refresh" data-t="refresh">Refresh</button>
      </nav>
      <section id="bookings" aria-live="polite" data-label="appointments" aria-label="Appointments">
        <p data-t="loading">Loading appointments…</p>
      </section>
    </main>
    <dialog id="booking-dialog" aria-labelledby="dialog-title">
      <button
        type="button"
        id="close-dialog"
        class="close-dialog"
        data-label="closeDialog"
        aria-label="Close"
      >
        ×
      </button>
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
